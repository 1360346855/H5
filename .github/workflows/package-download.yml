name: Publish downloadable Netlify package
on:
  push:
    branches: [deployment-download]
    paths: ['bundle/**', '.github/workflows/package-download.yml']
permissions:
  contents: write
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify source archive and apply navigation fix
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from zipfile import ZipFile,ZIP_DEFLATED
          manifest=json.loads(Path('bundle/manifest.json').read_text())
          patch_meta=json.loads(Path('bundle/navigation-fix.json').read_text())
          out=Path('release');out.mkdir()
          base=out/'base.zip';digest=hashlib.sha256()
          with base.open('wb') as stream:
              for part in manifest['parts']:
                  data=Path(part['path']).read_bytes()
                  assert len(data)==part['size'],part['path']
                  assert hashlib.sha256(data).hexdigest()==part['sha256'],part['path']
                  digest.update(data);stream.write(data)
          assert base.stat().st_size==manifest['size']
          assert digest.hexdigest()==manifest['sha256']
          from contextlib import ExitStack
          specifications=[patch_meta,json.loads(Path('bundle/folder-morph-update.json').read_text()),json.loads(Path('bundle/folder-posters-update.json').read_text()),json.loads(Path('bundle/reference-folder-update.json').read_text())]
          archive=out/manifest['filename']
          with ExitStack() as stack:
              patches=[]
              removed=set()
              for spec in specifications:
                  path=Path(spec['file'])
                  assert path.stat().st_size==spec['size']
                  assert hashlib.sha256(path.read_bytes()).hexdigest()==spec['sha256']
                  patch=stack.enter_context(ZipFile(path))
                  assert set(patch.namelist())==set(spec['files'])
                  patches.append(patch)
                  removed.update(spec.get('remove',[]))
              names=set().union(*(set(p.namelist()) for p in patches))
              source=stack.enter_context(ZipFile(base))
              target=stack.enter_context(ZipFile(archive,'w',ZIP_DEFLATED,compresslevel=6))
              for info in source.infolist():
                  if info.filename not in names and info.filename not in removed:target.writestr(info,source.read(info.filename))
              for index,patch in enumerate(patches):
                  later=set().union(*(set(p.namelist()) for p in patches[index+1:])) if index+1<len(patches) else set()
                  for info in patch.infolist():
                      if info.filename not in later:target.writestr(info,patch.read(info.filename))
          with ZipFile(archive) as z:
              assert z.testzip() is None
              assert 'preview-ending-navigation.js' in z.namelist()
              assert b'preview-ending-navigation.js?v=3' in z.read('index.html')
              assert b"dataset.previewEndingNavigation='protected-gallery'" in z.read('preview-ending-navigation.js')
              assert b'PORTFOLIO_PACKAGING' in z.read('packaging-data.js')
              assert b'PORTFOLIO_UI' in z.read('ui-data.js')
              assert len(json.loads(z.read('ui-data.js').decode().split('=',1)[1].strip().rstrip(';')))==3
              assert 'document-folder.js' in z.namelist() and 'ui-morph.js' in z.namelist()
              posters=json.loads(z.read('poster-data.js').decode().split('=',1)[1].strip().rstrip(';'))
              assert len(posters)==50
              assert len([p for p in posters if p.get('series')=='纳爱斯口腔护理'])==3
              assert b'docf-expression' in z.read('document-folder.js')
              assert b'docf-original-stickers' in z.read('document-folder.js')
              assert b'--dock-top' in z.read('document-folder.css')
              assert b'document-folder.js?v=10' in z.read('index.html')
              assert b'fallback.draggable=false' in z.read('ui-morph.js')
              assert b'delta>14&&scrollY' not in z.read('index.html')
              assert b'kaifeng-peanut-trimmed.svg' in z.read('packaging-data.js')
              assert 'assets/packaging/kaifeng-peanut-trimmed.svg' in z.namelist()
              assert b'if(matchMedia(\"(pointer:coarse)\").matches)' not in z.read('packaging-lanyard.js')
              (out/'xiabu-ui-board.webp').write_bytes(z.read('assets/ui/summer-board.webp'))
              (out/'pet-ui-board.webp').write_bytes(z.read('assets/ui/pet-board.webp'))
              (out/'papermaking-ui-board.webp').write_bytes(z.read('assets/ui/papermaking-board.webp'))
              assert 'assets/ui/papermaking-board.webp' in z.namelist()
              assert len([n for n in z.namelist() if n.startswith('assets/packaging/') and n.endswith('-full.webp')])==4
              assert not any('.netlify/' in name for name in z.namelist())
          digest=hashlib.sha256(archive.read_bytes()).hexdigest()
          (out/'SHA256SUMS.txt').write_text(digest+'  '+manifest['filename']+'\n')
          base.unlink()
          print('Updated deployment ZIP verified:',archive.stat().st_size,'bytes',digest)
          PY
      - name: Update the existing download URL
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload netlify-package-1 release/portfolio-netlify.zip release/SHA256SUMS.txt release/papermaking-ui-board.webp release/xiabu-ui-board.webp release/pet-ui-board.webp --clobber
          gh release edit netlify-package-1 --title "Netlify 作品集部署包 · 手机交互与吊牌修复版" --notes-file DOWNLOAD.md
