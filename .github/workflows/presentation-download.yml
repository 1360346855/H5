name: Publish editable presentation download
on:
  push:
    branches: [deployment-download]
    paths: ['presentation/**', '.github/workflows/presentation-download.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify all presentation members
        run: python presentation/rebuild.py
      - name: Publish presentation download files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload netlify-package-1 release/Curious_Project_Presentation.pptx release/Curious_Project_Presentation.zip --clobber
