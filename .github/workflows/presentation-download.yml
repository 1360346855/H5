name: Publish self-contained presentation with editable version register
on:
  push:
    branches: [deployment-download]
    paths: ['presentation/**', '.github/workflows/presentation-download.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild and verify editable presentation
        run: python presentation/rebuild.py
      - name: Publish self-contained PPT and backup ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload netlify-package-1 release/Curious_Project_Presentation_Integrated.pptx release/Curious_Project_Presentation_Integrated.zip --clobber
